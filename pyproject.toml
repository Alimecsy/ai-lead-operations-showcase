[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lead-operations-showcase"
version = "0.1.0"
description = "A sanitized, runnable AI lead-operations engineering showcase"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic[email]>=2.9.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["lead_ops*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lead_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
